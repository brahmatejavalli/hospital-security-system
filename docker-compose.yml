services:
  app:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    environment:
      APP_ENV: production
      DEMO_MODE: "false"
      DATA_DIR: /data
      SECRET_KEY: ${SECRET_KEY:?Generate .env.production with scripts/configure-production.py}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Generate .env.production with scripts/configure-production.py}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/medguard.db}
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    volumes:
      - medguard_data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  medguard_data:
